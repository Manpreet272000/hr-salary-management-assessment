spring:
  application:
    name: hr-salary-management
  datasource:
    # WAL lets readers proceed while a write is in progress; busy_timeout waits instead of failing on lock.
    url: jdbc:sqlite:${DB_PATH:hr.db}?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

app:
  payroll:
    tax-rate: 0.05
  seed:
    enabled: ${SEED_ENABLED:true}
    employee-count: 10000
    random-seed: 42
